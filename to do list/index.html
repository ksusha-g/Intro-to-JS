<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>My to do list</title>
</head>
<body>
    <div class="container" style="width: 300px;">
        <input type="text"
        id="task-input"
        placeholder="Введите задачу...">
        <button class="button" id="task-button">Добавить</button>
        <div><ul class="container" id="to-do-list">
        </ul></div>
    </div>
    <div class="container" id="sorting">
        <p>Сортировка:</p>
        <p><input type="checkbox" id="done">Выполнено</p>
        <p><input type="checkbox" id="not-done">Не выполнено</p>
    </div>
    <script src="main.js"></script>
</body>
</html>
